services:
  db:
    image: postgres:16-alpine
    container_name: tool_monitor_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tool_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tool_monitor_api
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/tool_monitor
      - SECRET_KEY=super-secret-jwt-key-auto-tool-monitoring-2026
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/artifacts:/app/backend/artifacts

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tool_monitor_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
